services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: taxi_postgres
    restart: always
    environment:
      POSTGRES_DB: taxi
      POSTGRES_USER: taxi
      POSTGRES_PASSWORD: taxi_password
    ports:
      - "5432:5432"
    volumes:
      - taxi_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: taxi_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: taxi_backend
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: taxi
      DB_PASSWORD: taxi_password
      DB_NAME: taxi
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  taxi_pg_data: