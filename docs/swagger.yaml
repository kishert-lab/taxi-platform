basePath: /api/v1
definitions:
  cmd_api.apiHealthResponse:
    properties:
      service:
        example: taxi-platform
        type: string
      status:
        example: ok
        type: string
    type: object
  cmd_api.healthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  dto.CoordinatesResponse:
    properties:
      latitude:
        example: 56.838011
        type: number
      longitude:
        example: 60.597465
        type: number
    type: object
  dto.CurrentOrderResponse:
    properties:
      order:
        $ref: '#/definitions/dto.OrderResponse'
    type: object
  dto.MoneyResponse:
    properties:
      amount:
        example: 25000
        type: integer
      currency:
        example: RUB
        type: string
    type: object
  dto.OrderResponse:
    properties:
      city_id:
        type: string
      destination_address:
        type: string
      driver_id:
        type: string
      estimated_price:
        $ref: '#/definitions/dto.MoneyResponse'
      final_price:
        $ref: '#/definitions/dto.MoneyResponse'
      id:
        type: string
      passenger_id:
        type: string
      payment_method:
        allOf:
        - $ref: '#/definitions/github_com_develoop_taxi-platform_internal_domain.PaymentMethod'
        example: cash
      pickup_address:
        type: string
      pickup_location:
        $ref: '#/definitions/dto.CoordinatesResponse'
      status:
        allOf:
        - $ref: '#/definitions/github_com_develoop_taxi-platform_internal_domain.OrderStatus'
        example: searching
      tariff_id:
        type: string
      version:
        example: 2
        type: integer
    type: object
  dto.StartRegistrationRequest:
    properties:
      city_id:
        example: 11111111-1111-1111-1111-111111111111
        type: string
      email:
        example: user@example.com
        type: string
      first_name:
        example: Ivan
        type: string
      last_name:
        example: Petrov
        type: string
      password:
        example: strong-password
        minLength: 8
        type: string
      personal_data_consent:
        example: true
        type: boolean
      phone:
        example: "+79990000000"
        type: string
      privacy_policy_version:
        example: "1.0"
        type: string
      registration_type:
        allOf:
        - $ref: '#/definitions/github_com_develoop_taxi-platform_internal_domain.RegistrationType'
        enum:
        - passenger
        - driver
        - taxi_park
        example: passenger
      taxi_park:
        $ref: '#/definitions/dto.TaxiParkRegistration'
      terms_accepted:
        example: true
        type: boolean
      terms_version:
        example: "1.0"
        type: string
    required:
    - email
    - first_name
    - password
    - personal_data_consent
    - phone
    - privacy_policy_version
    - registration_type
    - terms_accepted
    - terms_version
    type: object
  dto.StartRegistrationResponse:
    properties:
      email_masked:
        example: u***@example.com
        type: string
      message:
        example: confirmation codes sent
        type: string
      phone_masked:
        example: +7*****000
        type: string
      registration_type:
        allOf:
        - $ref: '#/definitions/github_com_develoop_taxi-platform_internal_domain.RegistrationType'
        example: passenger
      role:
        allOf:
        - $ref: '#/definitions/github_com_develoop_taxi-platform_internal_domain.UserRole'
        example: passenger
      user_id:
        example: 33333333-3333-3333-3333-333333333333
        type: string
    type: object
  dto.TaxiParkRegistration:
    properties:
      legal_name:
        example: North Taxi Park LLC
        type: string
      name:
        example: North Taxi Park
        type: string
      tax_id:
        example: "7700000000"
        type: string
    type: object
  github_com_develoop_taxi-platform_internal_domain.OrderStatus:
    enum:
    - created
    - searching
    - driver_assigned
    - driver_arriving
    - driver_waiting
    - in_progress
    - completed
    - cancelled
    - failed
    type: string
    x-enum-varnames:
    - OrderStatusCreated
    - OrderStatusSearching
    - OrderStatusDriverAssigned
    - OrderStatusDriverArriving
    - OrderStatusDriverWaiting
    - OrderStatusInProgress
    - OrderStatusCompleted
    - OrderStatusCancelled
    - OrderStatusFailed
  github_com_develoop_taxi-platform_internal_domain.PaymentMethod:
    enum:
    - cash
    - card
    - corporate
    type: string
    x-enum-varnames:
    - PaymentMethodCash
    - PaymentMethodCard
    - PaymentMethodCorporate
  github_com_develoop_taxi-platform_internal_domain.RegistrationType:
    enum:
    - passenger
    - driver
    - taxi_park
    type: string
    x-enum-varnames:
    - RegistrationTypePassenger
    - RegistrationTypeDriver
    - RegistrationTypeTaxiPark
  github_com_develoop_taxi-platform_internal_domain.UserRole:
    enum:
    - passenger
    - driver
    - taxi_park
    - admin
    - dispatcher
    type: string
    x-enum-varnames:
    - UserRolePassenger
    - UserRoleDriver
    - UserRoleTaxiPark
    - UserRoleAdmin
    - UserRoleDispatcher
  handler.errorResponse:
    properties:
      error:
        example: personal data consent required
        type: string
    type: object
info:
  contact:
    email: support@example.com
    name: Taxi Platform API Support
  description: Production-grade taxi backend API for small cities and rural areas.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Taxi Platform API
  version: 0.1.0
paths:
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers passenger, driver, or taxi park owner. Personal data
        consent and terms acceptance are mandatory.
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.StartRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.StartRegistrationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.errorResponse'
      summary: Register user
      tags:
      - auth
  /health:
    get:
      description: Returns public API health status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.apiHealthResponse'
      summary: API health
      tags:
      - health
  /health/live:
    get:
      description: Returns process liveness status for orchestrators.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.healthResponse'
      summary: Liveness probe
      tags:
      - health
  /health/ready:
    get:
      description: Returns readiness status for traffic routing.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.healthResponse'
      summary: Readiness probe
      tags:
      - health
  /orders/current:
    get:
      description: Returns current active trip state for reconnect recovery.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CurrentOrderResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.errorResponse'
      security:
      - BearerAuth: []
      summary: Get current order
      tags:
      - orders
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Enter the token with the `Bearer ` prefix, for example: Bearer eyJhbGciOi...'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
