basePath: /api/v1
definitions:
  cmd_api.apiHealthResponse:
    properties:
      service:
        example: taxi-platform
        type: string
      status:
        example: ok
        type: string
    type: object
  cmd_api.healthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  dto.AssignedDriverDTO:
    properties:
      id:
        example: 55555555-5555-5555-5555-555555555555
        type: string
      name:
        example: Ivan
        type: string
      phone:
        example: "+79990000001"
        type: string
      rating:
        example: 4.95
        type: number
    type: object
  dto.AuthCodeSentResponse:
    properties:
      delivery_channel:
        example: sms
        type: string
      message:
        example: verification code sent
        type: string
    type: object
  dto.AuthLoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      phone:
        example: "+79990000000"
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_domain.UserRole'
        enum:
        - passenger
        - driver
        - taxi_park
        - admin
        - dispatcher
        example: passenger
    required:
    - role
    type: object
  dto.AuthTokenResponse:
    properties:
      access_token:
        example: eyJhbGciOi...
        type: string
      expires_in:
        example: 900
        type: integer
      refresh_token:
        example: eyJhbGciOi...
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  dto.AuthVerifyCodeRequest:
    properties:
      code:
        example: "123456"
        type: string
      email:
        example: user@example.com
        type: string
      phone:
        example: "+79990000000"
        type: string
      role:
        allOf:
        - $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_domain.UserRole'
        enum:
        - passenger
        - driver
        - taxi_park
        - admin
        - dispatcher
        example: passenger
    required:
    - code
    - role
    type: object
  dto.CancelOrderRequest:
    properties:
      reason:
        example: Passenger changed plans
        type: string
    required:
    - reason
    type: object
  dto.CarDTO:
    properties:
      brand:
        example: Lada
        type: string
      color:
        example: White
        type: string
      id:
        example: 77777777-7777-7777-7777-777777777777
        type: string
      model:
        example: Vesta
        type: string
      plate_number:
        example: A001AA196
        type: string
    type: object
  dto.CompleteOrderRequest:
    properties:
      currency:
        example: RUB
        type: string
      final_price:
        example: 260
        minimum: 0
        type: integer
    required:
    - currency
    - final_price
    type: object
  dto.CoordinatesRequest:
    properties:
      latitude:
        example: 56.838011
        maximum: 90
        minimum: -90
        type: number
      longitude:
        example: 60.597465
        maximum: 180
        minimum: -180
        type: number
    required:
    - latitude
    - longitude
    type: object
  dto.CoordinatesResponse:
    properties:
      latitude:
        example: 56.838011
        type: number
      longitude:
        example: 60.597465
        type: number
    type: object
  dto.CurrentOrderResponse:
    properties:
      order:
        $ref: '#/definitions/dto.OrderResponse'
    type: object
  dto.DriverLocationBatchRequest:
    properties:
      locations:
        items:
          $ref: '#/definitions/dto.DriverLocationRequest'
        maxItems: 50
        minItems: 1
        type: array
    required:
    - locations
    type: object
  dto.DriverLocationRequest:
    properties:
      accuracy_meters:
        example: 12.5
        minimum: 0
        type: number
      heading:
        example: 90
        maximum: 359
        minimum: 0
        type: integer
      location:
        $ref: '#/definitions/dto.CoordinatesRequest'
      speed_mps:
        example: 8.3
        minimum: 0
        type: number
    required:
    - location
    type: object
  dto.DriverOrderHistoryResponse:
    properties:
      orders:
        items:
          $ref: '#/definitions/dto.DriverOrderResponse'
        type: array
    type: object
  dto.DriverOrderResponse:
    properties:
      allowed_actions:
        example:
        - arrived
        - call_passenger
        items:
          type: string
        type: array
      comment:
        example: Entrance 2
        type: string
      destination_point:
        $ref: '#/definitions/dto.PointDTO'
      order_id:
        example: 44444444-4444-4444-4444-444444444444
        type: string
      passenger:
        $ref: '#/definitions/dto.PassengerBriefDTO'
      pickup_point:
        $ref: '#/definitions/dto.PointDTO'
      price:
        $ref: '#/definitions/dto.MoneyResponse'
      status:
        allOf:
        - $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_domain.OrderStatus'
        example: driver_assigned
      timeline:
        items:
          $ref: '#/definitions/dto.OrderTimelineItem'
        type: array
      version:
        example: 3
        type: integer
    type: object
  dto.DriverProfilePatchRequest:
    properties:
      license_number:
        example: "7700000000"
        type: string
      name:
        example: Ivan
        type: string
    type: object
  dto.DriverProfileResponse:
    properties:
      id:
        example: 22222222-2222-2222-2222-222222222222
        type: string
      is_verified:
        example: true
        type: boolean
      license_number:
        example: "7700000000"
        type: string
      name:
        example: Ivan
        type: string
      phone:
        example: "+79990000001"
        type: string
      rating:
        example: 4.95
        type: number
      status:
        allOf:
        - $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_domain.DriverStatus'
        example: online
      user_id:
        example: 33333333-3333-3333-3333-333333333333
        type: string
    type: object
  dto.LogoutRequest:
    properties:
      refresh_token:
        example: eyJhbGciOi...
        type: string
    required:
    - refresh_token
    type: object
  dto.MoneyResponse:
    properties:
      amount:
        example: 25000
        type: integer
      currency:
        example: RUB
        type: string
    type: object
  dto.OrderEstimateRequest:
    properties:
      city_id:
        example: 11111111-1111-1111-1111-111111111111
        type: string
      destination_location:
        $ref: '#/definitions/dto.CoordinatesRequest'
      pickup_location:
        $ref: '#/definitions/dto.CoordinatesRequest'
      tariff_id:
        example: 22222222-2222-2222-2222-222222222222
        type: string
    required:
    - city_id
    - destination_location
    - pickup_location
    - tariff_id
    type: object
  dto.OrderEstimateResponse:
    properties:
      currency:
        example: RUB
        type: string
      distance_km:
        example: 4.2
        type: number
      duration_min:
        example: 11
        type: integer
      price:
        example: 250
        type: integer
      price_type:
        example: estimated
        type: string
      tariff_id:
        example: 22222222-2222-2222-2222-222222222222
        type: string
      tariff_name:
        example: Economy
        type: string
    type: object
  dto.OrderHistoryResponse:
    properties:
      orders:
        items:
          $ref: '#/definitions/dto.PassengerOrderResponse'
        type: array
    type: object
  dto.OrderResponse:
    properties:
      city_id:
        type: string
      destination_address:
        type: string
      driver_id:
        type: string
      estimated_price:
        $ref: '#/definitions/dto.MoneyResponse'
      final_price:
        $ref: '#/definitions/dto.MoneyResponse'
      id:
        type: string
      passenger_id:
        type: string
      payment_method:
        allOf:
        - $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_domain.PaymentMethod'
        example: cash
      pickup_address:
        type: string
      pickup_location:
        $ref: '#/definitions/dto.CoordinatesResponse'
      status:
        allOf:
        - $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_domain.OrderStatus'
        example: searching
      tariff_id:
        type: string
      version:
        example: 2
        type: integer
    type: object
  dto.OrderTimelineItem:
    properties:
      occurred_at:
        example: "2026-05-12T12:00:00Z"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_domain.OrderStatus'
        example: driver_assigned
    type: object
  dto.PassengerBriefDTO:
    properties:
      id:
        example: 66666666-6666-6666-6666-666666666666
        type: string
      name:
        example: Irina
        type: string
      phone:
        example: "+79990000000"
        type: string
    type: object
  dto.PassengerCreateOrderRequest:
    properties:
      city_id:
        example: 11111111-1111-1111-1111-111111111111
        type: string
      comment:
        example: Entrance 2
        type: string
      destination_address:
        example: Mira 10
        type: string
      destination_location:
        $ref: '#/definitions/dto.CoordinatesRequest'
      passenger_phone:
        example: "+79990000000"
        type: string
      payment_type:
        allOf:
        - $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_domain.PaymentMethod'
        enum:
        - cash
        - card
        - corporate
        example: cash
      pickup_address:
        example: Lenina 1
        type: string
      pickup_location:
        $ref: '#/definitions/dto.CoordinatesRequest'
      tariff_id:
        example: 22222222-2222-2222-2222-222222222222
        type: string
    required:
    - city_id
    - destination_address
    - destination_location
    - payment_type
    - pickup_address
    - pickup_location
    - tariff_id
    type: object
  dto.PassengerOrderResponse:
    properties:
      allowed_actions:
        example:
        - cancel
        - call_driver
        items:
          type: string
        type: array
      car:
        $ref: '#/definitions/dto.CarDTO'
      destination_point:
        $ref: '#/definitions/dto.PointDTO'
      driver:
        $ref: '#/definitions/dto.AssignedDriverDTO'
      eta_seconds:
        example: 420
        type: integer
      order_id:
        example: 44444444-4444-4444-4444-444444444444
        type: string
      pickup_point:
        $ref: '#/definitions/dto.PointDTO'
      price:
        $ref: '#/definitions/dto.MoneyResponse'
      status:
        allOf:
        - $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_domain.OrderStatus'
        example: driver_arriving
      timeline:
        items:
          $ref: '#/definitions/dto.OrderTimelineItem'
        type: array
      version:
        example: 3
        type: integer
    type: object
  dto.PassengerProfilePatchRequest:
    properties:
      email:
        example: irina@example.com
        type: string
      name:
        example: Irina
        type: string
    type: object
  dto.PassengerProfileRequest:
    properties:
      email:
        example: irina@example.com
        type: string
      name:
        example: Irina
        type: string
    required:
    - name
    type: object
  dto.PassengerProfileResponse:
    properties:
      email:
        example: irina@example.com
        type: string
      id:
        example: 11111111-1111-1111-1111-111111111111
        type: string
      name:
        example: Irina
        type: string
      phone:
        example: "+79990000000"
        type: string
    type: object
  dto.PointDTO:
    properties:
      address:
        example: Lenina 1
        type: string
      location:
        $ref: '#/definitions/dto.CoordinatesResponse'
    type: object
  dto.RateOrderRequest:
    properties:
      comment:
        example: Good driver
        type: string
      score:
        example: 5
        maximum: 5
        minimum: 1
        type: integer
    required:
    - score
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOi...
        type: string
    required:
    - refresh_token
    type: object
  dto.RejectOrderRequest:
    properties:
      reason:
        example: Too far
        type: string
    required:
    - reason
    type: object
  dto.StartRegistrationRequest:
    properties:
      city_id:
        example: 11111111-1111-1111-1111-111111111111
        type: string
      email:
        example: user@example.com
        type: string
      first_name:
        example: Ivan
        type: string
      last_name:
        example: Petrov
        type: string
      password:
        example: strong-password
        minLength: 8
        type: string
      personal_data_consent:
        example: true
        type: boolean
      phone:
        example: "+79990000000"
        type: string
      privacy_policy_version:
        example: "1.0"
        type: string
      registration_type:
        allOf:
        - $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_domain.RegistrationType'
        enum:
        - passenger
        - driver
        - taxi_park
        example: passenger
      taxi_park:
        $ref: '#/definitions/dto.TaxiParkRegistration'
      terms_accepted:
        example: true
        type: boolean
      terms_version:
        example: "1.0"
        type: string
    required:
    - email
    - first_name
    - password
    - personal_data_consent
    - phone
    - privacy_policy_version
    - registration_type
    - terms_accepted
    - terms_version
    type: object
  dto.TaxiParkRegistration:
    properties:
      legal_name:
        example: North Taxi Park LLC
        type: string
      name:
        example: North Taxi Park
        type: string
      tax_id:
        example: "7700000000"
        type: string
    type: object
  github_com_kishert-lab_taxi-platform_internal_domain.DriverStatus:
    enum:
    - offline
    - online
    - busy
    - paused
    - blocked
    type: string
    x-enum-varnames:
    - DriverStatusOffline
    - DriverStatusOnline
    - DriverStatusBusy
    - DriverStatusPaused
    - DriverStatusBlocked
  github_com_kishert-lab_taxi-platform_internal_domain.OrderStatus:
    enum:
    - created
    - searching
    - driver_assigned
    - driver_arriving
    - driver_waiting
    - in_progress
    - completed
    - cancelled
    - failed
    type: string
    x-enum-varnames:
    - OrderStatusCreated
    - OrderStatusSearching
    - OrderStatusDriverAssigned
    - OrderStatusDriverArriving
    - OrderStatusDriverWaiting
    - OrderStatusInProgress
    - OrderStatusCompleted
    - OrderStatusCancelled
    - OrderStatusFailed
  github_com_kishert-lab_taxi-platform_internal_domain.PaymentMethod:
    enum:
    - cash
    - card
    - corporate
    type: string
    x-enum-varnames:
    - PaymentMethodCash
    - PaymentMethodCard
    - PaymentMethodCorporate
  github_com_kishert-lab_taxi-platform_internal_domain.RegistrationType:
    enum:
    - passenger
    - driver
    - taxi_park
    type: string
    x-enum-varnames:
    - RegistrationTypePassenger
    - RegistrationTypeDriver
    - RegistrationTypeTaxiPark
  github_com_kishert-lab_taxi-platform_internal_domain.UserRole:
    enum:
    - passenger
    - driver
    - taxi_park
    - admin
    - dispatcher
    type: string
    x-enum-varnames:
    - UserRolePassenger
    - UserRoleDriver
    - UserRoleTaxiPark
    - UserRoleAdmin
    - UserRoleDispatcher
  github_com_kishert-lab_taxi-platform_pkg_response.Error:
    properties:
      error:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.ErrorBody'
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  github_com_kishert-lab_taxi-platform_pkg_response.ErrorBody:
    properties:
      code:
        allOf:
        - $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.ErrorCode'
        example: ORDER_NOT_FOUND
      details:
        additionalProperties: {}
        type: object
      message:
        example: Order not found
        type: string
    type: object
  github_com_kishert-lab_taxi-platform_pkg_response.ErrorCode:
    enum:
    - VALIDATION_ERROR
    - UNAUTHORIZED
    - FORBIDDEN
    - ORDER_NOT_FOUND
    - ORDER_INVALID_STATE
    - DRIVER_NOT_AVAILABLE
    - ORDER_ALREADY_ASSIGNED
    - DISPATCH_IN_PROGRESS
    - RATE_LIMITED
    - CONSENT_REQUIRED
    - INTERNAL_ERROR
    type: string
    x-enum-varnames:
    - CodeValidationError
    - CodeUnauthorized
    - CodeForbidden
    - CodeOrderNotFound
    - CodeOrderInvalidState
    - CodeDriverNotAvailable
    - CodeOrderAlreadyAssigned
    - CodeDispatchInProgress
    - CodeRateLimited
    - CodeConsentRequired
    - CodeInternalError
  github_com_kishert-lab_taxi-platform_pkg_response.Meta:
    properties:
      request_id:
        example: 11111111-1111-1111-1111-111111111111
        type: string
    type: object
  github_com_kishert-lab_taxi-platform_pkg_response.Success:
    properties:
      data: {}
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  handler.AcceptedSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/handler.acceptedResponse'
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  handler.AuthCodeSentSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.AuthCodeSentResponse'
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  handler.AuthTokenSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.AuthTokenResponse'
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  handler.DriverOrderHistorySuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.DriverOrderHistoryResponse'
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  handler.DriverOrderSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.DriverOrderResponse'
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  handler.DriverProfileSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.DriverProfileResponse'
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  handler.OrderEstimateSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.OrderEstimateResponse'
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  handler.PassengerOrderHistorySuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.OrderHistoryResponse'
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  handler.PassengerOrderSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.PassengerOrderResponse'
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  handler.PassengerProfileSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/dto.PassengerProfileResponse'
      meta:
        $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Meta'
    type: object
  handler.acceptedResponse:
    properties:
      accepted:
        example: true
        type: boolean
    type: object
  handler.errorResponse:
    properties:
      error:
        example: personal data consent required
        type: string
    type: object
info:
  contact:
    email: support@example.com
    name: Taxi Platform API Support
  description: Production-grade taxi backend API for small cities and rural areas.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Taxi Platform API
  version: 0.1.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Sends verification code to phone or email. At least one of phone
        or email must be provided.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthCodeSentSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Start phone or email login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the provided refresh token.
      parameters:
      - description: Logout request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AcceptedSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Logout mobile user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Returns new access and refresh tokens. Old refresh token must be
        invalidated by service layer.
      parameters:
      - description: Refresh request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AuthTokenSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Rotate refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers passenger, driver, or taxi park owner. Personal data
        consent and terms acceptance are mandatory.
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.StartRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Success'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "500":
          description: Internal Server Error
