info:
  contact:
    email: support@example.com
    name: Taxi Platform API Support
  description: Production-grade taxi backend API for small cities and rural areas.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Taxi Platform API
  version: 0.1.0
paths:
  /admin/finance/overview:
    get:
      parameters:
      - description: Period start RFC3339
        in: query
        name: from
        type: string
      - description: Period end RFC3339
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_handler.AdminFinanceOverviewSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      security:
      - BearerAuth: []
      summary: Get admin finance overview
      tags:
      - finance-admin
  /admin/geocoder/export/pelias-csv:
    get:
      description: Exports only platform-owned trusted local_geo_points; temporary
        external geocoder cache is never exported.
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            type: file
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Export trusted local points as Pelias CSV
      tags:
      - admin-geocoder
  /admin/geocoder/local-points:
    get:
      parameters:
      - description: City UUID
        in: query
        name: city_id
        type: string
      - description: confirmed|trusted|rejected
        in: query
        name: trust_level
        type: string
      - description: Limit
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_geocoder_handler.LocalPointsSuccessResponse'
      summary: List local geocoder points
      tags:
      - admin-geocoder
    post:
      consumes:
      - application/json
      parameters:
      - description: Local point
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_geocoder_handler.AdminLocalPointRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_geocoder_handler.LocalPointSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Create admin local geocoder point
      tags:
      - admin-geocoder
  /admin/geocoder/local-points/{id}/approve:
    post:
      parameters:
      - description: Local point UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_geocoder_handler.LocalPointSuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Approve local geocoder point
      tags:
      - admin-geocoder
  /admin/geocoder/local-points/{id}/reject:
    post:
      parameters:
      - description: Local point UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_geocoder_handler.LocalPointSuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Reject local geocoder point
      tags:
      - admin-geocoder
  /admin/legal/documents:
    get:
      parameters:
      - description: Document type
        in: query
        name: document_type
        type: string
      - default: ru
        description: Language
        in: query
        name: language
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_handler.LegalDocumentsSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      security:
      - BearerAuth: []
      summary: List legal document versions
      tags:
      - admin-legal
    post:
      consumes:
      - application/json
      parameters:
      - description: Legal document
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_dto.LegalDocumentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_transport_http_handler.LegalDocumentSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      security:
      - BearerAuth: []
      summary: Create new immutable legal document version
      tags:
      - admin-legal
  /admin/legal/documents/{id}/activate:
    post:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_handler.LegalDocumentSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      security:
      - BearerAuth: []
      summary: Activate legal document version
      tags:
      - admin-legal
  /admin/legal/documents/{id}/deactivate:
    post:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_handler.LegalDocumentSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      security:
      - BearerAuth: []
      summary: Deactivate legal document version
      tags:
      - admin-legal
  /auth/email/send-code:
    post:
      consumes:
      - application/json
      description: Explicit mail endpoint for mobile clients that authorize by email.
      parameters:
      - description: Email code request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_dto.AuthEmailCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_handler.AuthCodeSentSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Send email verification code
      tags:
      - auth
  /auth/email/verify:
    post:
      consumes:
      - application/json
      description: Explicit mail verification endpoint. Returns rotated access/refresh
        token pair.
      parameters:
      - description: Email verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_dto.AuthEmailVerifyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_handler.AuthTokenSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Verify email code
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Sends verification code to phone or email. At least one of phone
        or email must be provided.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_dto.AuthLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_handler.AuthCodeSentSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Start phone or email login
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the provided refresh token.
      parameters:
      - description: Logout request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_handler.AcceptedSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Logout mobile user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Returns new access and refresh tokens. Old refresh token must be
        invalidated by service layer.
      parameters:
      - description: Refresh request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_handler.AuthTokenSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Rotate refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers passenger, driver, or taxi park owner. Personal data
        consent and terms acceptance are mandatory.
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_dto.StartRegistrationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Success'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Register user
      tags:
      - auth
  /auth/verify-code:
    post:
      consumes:
      - application/json
      description: Verifies SMS or email code and returns access/refresh tokens.
      parameters:
      - description: Verification request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kishert-lab_taxi-platform_internal_dto.AuthVerifyCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_handler.AuthTokenSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kishert-lab_taxi-platform_pkg_response.Error'
      summary: Verify login code
      tags:
      - auth
  /dispatcher/orders:
    get:
      description: Returns recent orders in the dispatcher's taxi park city.
      parameters:
      - description: Limit, max 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_transport_http_handler.DispatcherOrdersSuccessResponse'
        "401":
