services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - taxi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - taxi_internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - taxi_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - taxi_internal

  pelias-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.23
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${PELIAS_ES_JAVA_OPTS:-"-Xms512m -Xmx512m"}
      bootstrap.memory_lock: "true"
      TZ: ${TZ:-Asia/Yekaterinburg}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - taxi_pelias_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - taxi_internal

  pelias-libpostal:
    image: pelias/libpostal-service:latest
    restart: unless-stopped
    networks:
      - taxi_internal

  pelias:
    image: pelias/api:v7.8.0
    restart: unless-stopped
    depends_on:
      pelias-elasticsearch:
        condition: service_healthy
      pelias-libpostal:
        condition: service_started
    environment:
      PELIAS_CONFIG: /code/pelias.json
      PORT: 4000
      HOST: 0.0.0.0
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - ./configs/pelias.json:/code/pelias.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/v1 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    networks:
      - taxi_internal

  migrate:
    image: migrate/migrate:v4.18.1
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up
    networks:
      - taxi_internal

  backend:
    image: ${BACKEND_IMAGE:-registry.dev.it59com.ru/taxi-platform/api}:${BACKEND_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pelias:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      TAXI_APP_ENV: production
      TAXI_SERVER_HOST: 0.0.0.0
      TAXI_SERVER_PORT: 8080
      TAXI_SERVER_MODE: release
      TAXI_DATABASE_HOST: postgres
      TAXI_DATABASE_PORT: 5432
      TAXI_DATABASE_USER: ${POSTGRES_USER}
      TAXI_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      TAXI_DATABASE_NAME: ${POSTGRES_DB}
      TAXI_DATABASE_SSL_MODE: disable
      TAXI_REDIS_HOST: redis
      TAXI_REDIS_PORT: 6379
      TAXI_REDIS_PASSWORD: ${REDIS_PASSWORD}
      TAXI_JWT_ACCESS_SECRET: ${TAXI_JWT_ACCESS_SECRET:?TAXI_JWT_ACCESS_SECRET is required}
      TAXI_JWT_REFRESH_SECRET: ${TAXI_JWT_REFRESH_SECRET:?TAXI_JWT_REFRESH_SECRET is required}
      TAXI_LOGGER_LEVEL: ${TAXI_LOGGER_LEVEL:-info}
      TAXI_GEOCODER_PELIAS_URL: http://pelias:4000
      TAXI_GEOCODER_YANDEX_API_KEY: ${GEOCODER_YANDEX_API_KEY:-}
      TAXI_GEOCODER_YANDEX_ENABLED: ${GEOCODER_YANDEX_ENABLED:-false}
      TAXI_GEOCODER_DADATA_API_KEY: ${GEOCODER_DADATA_API_KEY:-}
      TAXI_GEOCODER_DADATA_SECRET_KEY: ${GEOCODER_DADATA_SECRET_KEY:-}
      TAXI_GEOCODER_DADATA_ENABLED: ${GEOCODER_DADATA_ENABLED:-false}
      TAXI_GEOCODER_DADATA_URL: ${GEOCODER_DADATA_URL:-https://cleaner.dadata.ru/api/v1/clean/address}
      TAXI_GEOCODER_DADATA_SUGGEST_URL: ${GEOCODER_DADATA_SUGGEST_URL:-https://suggestions.dadata.ru/suggestions/api/4_1/rs/suggest/address}
      TAXI_GEOCODER_EXTERNAL_CACHE_TTL_DAYS: ${GEOCODER_EXTERNAL_CACHE_TTL_DAYS:-30}
      TAXI_GEOCODER_YANDEX_CACHE_TTL_DAYS: ${GEOCODER_YANDEX_CACHE_TTL_DAYS:-30}
      TAXI_GEOCODER_DADATA_CACHE_TTL_DAYS: ${GEOCODER_DADATA_CACHE_TTL_DAYS:-3650}
      TAXI_GEOCODER_PELIAS_CACHE_TTL_DAYS: ${GEOCODER_PELIAS_CACHE_TTL_DAYS:-3650}
      TAXI_GEOCODER_PELIAS_CONFIDENCE_THRESHOLD: ${GEOCODER_PELIAS_CONFIDENCE_THRESHOLD:-0.75}
    volumes:
      - taxi_uploads:/app/uploads
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - taxi_internal
      - taxi_public

  web:
    image: ${WEB_IMAGE:-registry.dev.it59com.ru/taxi-platform/taxi-web}:${WEB_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - taxi_internal
      - taxi_public

volumes:
  taxi_pg_data:
  taxi_redis_data:
  taxi_pelias_es_data:
  taxi_uploads:

networks:
  taxi_internal:
    driver: bridge
    internal: true
  taxi_public:
    driver: bridge
